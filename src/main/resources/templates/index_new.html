<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{top}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user index">
	<div class="top-page-container">
		<div id="carouselId" class="carousel slide slider__container py-4" data-bs-ride="carousel">
			<div class="carousel-inner" role="listbox">
				<div th:each="img, imgStat : ${sliderImgs}"   class="carousel-item" th:classappend="${imgStat.index == 0} ? 'active' : ''">
					<img th:src="@{${img}}" class="w-100 d-block" >
				</div>
			</div>
			<button class="carousel-control-prev" type="button" data-bs-target="#carouselId" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button" data-bs-target="#carouselId" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
		<div class="d-flex justify-content-between py-4">
			<div class="d-flex align-items-start">
				<a href="">
					<img class="top-page__link-image" th:src="@{/static/images/web_images/home/new_arrival.png}" alt="">
				</a>
			</div>
			<div class="d-flex align-items-end">
				<a href="">
					<img class="top-page__link-image" th:src="@{/static/images/web_images/home/hot_seller.png}" alt="">
				</a>
			</div>
	</div>

	</div>
</body>

</html>

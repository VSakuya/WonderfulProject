<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(title,body)">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}" />
<script th:src="@{/js/jquery-3.7.0.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<title th:replace="${title}">シェアードショップ</title>
</head>
<body class="admin">
	<!--/* ヘッダー */-->
	<header>
		<div th:replace="~{admin/layout/header :: layout-header}"></div>
	</header>
	<div class="container">
		<!--/* サイドバー */-->
		<aside th:replace="~{admin/layout/sidebar :: layout-sidebar}">
		</aside>
		<!--/* メイン */-->
		<article class="main">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer>
		<div th:replace="~{admin/layout/footer :: layout-footer}"></div>
	</footer>
</body>
</html>

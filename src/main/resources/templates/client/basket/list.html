<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"　th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title　th:text="#{basket}+' | '+ #{shop.title}"> </title>
</head>
<body>
	<h2 class="title">
					買い物かご
				</h2>
				<table class="list_table basket">
					<tr>
						<th th:text="#{data.basket.item.name}">
						</th>
						<th th:text="#{data.basket.count}">
						</th>
						<th th:text="#{data.basket.operate}">
						</th>
						<th th:text="#{data.basket.stock.status}">
						</th>
					</tr>
					<tr>
						<td>
							<a href="/shared_shop/client/item/detail/6">
								人間失格
							</a>
						</td>
						<td>
							1
						</td>
						<td>
							<form action="/shared_shop/client/basket/delete" method="post">
								<input type="hidden" name="id" value="6" />
								<input type="submit" value="削除" class="delete"/>
							</form>
						</td>
						<td>
							4
						</td>
					</tr>
					

					
					
					
					<tr th:each="basket: ${session.baskets}">
						<td>
							<a th:href="@{/client/item/detail/{id}(id=${basket.id})}" th:text="${basket.name}"> </a>
						</td>
						<td>
							2
						</td>
						<td>
							<form action="/shared_shop/client/basket/delete" method="post">
								<input type="hidden" name="id" value="6" />
								<input type="submit" value="削除" class="delete"/>
							</form>
						</td>
						<td th:text="${basket.stock}"></td>
					</tr>
					
					
					
					
					
					
					
					<tr>
						<td>
							<a href="/shared_shop/client/item/detail/3">
								オレンジ
							</a>
						</td>
						<td>
							2
						</td>
						<td>
							<form action="/client/basket/delete" method="post">
								<input type="hidden" name="id" value="3" />
								<input type="submit" value="削除" class="delete"/>
							</form>
						</td>
						<td>
							在庫あり
						</td>
					</tr>

					
				</table>
				
				<div th:text="${session.id}"></div>
				
				
				<div class="user_info_form_area  shopping_button">
					<form action="/client/order/address/input" method="post">
						<input type="submit" value="ご注文のお手続き" />
					</form>
					<form action="/client/basket/allDelete" method="post">
						<input type="submit" value="買い物かごを空にする" class="delete" />
					</form>
				</div>
</body>
</html>

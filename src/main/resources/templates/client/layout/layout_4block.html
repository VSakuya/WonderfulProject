<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(title,body)">
<head th:replace="client/layout/head :: head_fragment()"></head>
<body class="user">
	<!--/* ヘッダー */-->
	<header>
		<div th:replace="~{client/layout/header :: layout-header}"></div>
	</header>
	<div class="container-90 row">
		<!--/* サイドバー */-->
		<aside class="col-2" th:replace="~{client/layout/sidebar :: layout-sidebar}">
		</aside>
		<!--/* メイン */-->
		<article class="col-10">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer>
		<div th:replace="~{client/layout/footer :: layout-footer}"></div>
	</footer>
</body>
</html>

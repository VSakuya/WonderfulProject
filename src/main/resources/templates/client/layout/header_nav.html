<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
</head>

<body>
	<div th:fragment="layout-header" class="container-fluid">

		<div class="row justify-content-center align-items-center gy-4 text-center">
			<div class="col-1 d-none d-xl-block"></div>
			<div class="col-1 d-none d-xl-block">
				<div class="header__icon">
					<img th:src="@{/static/images/web_images/header/search_i.png}" alt="">
				</div>
			</div>
			<div class="col-1 d-none d-xl-block"></div>
			<div class="header__title col">
				<a th:href="@{/}">
					<img th:src="@{/static/images/web_images/header/wondermen_i.png}" alt="">
				</a>
			</div>
			<div class="col-2 d-none d-xl-block">
				<div class="header__icon-wide" th:if="${session.user != null}">
					<a th:href="@{/client/user/detail}">
						<img th:src="@{/static/images/web_images/header/mypage2_i.png}" alt="">
					</a>
				</div>
				<div class="header__icon" th:if="${session.user != null}">
					<a th:href="@{/logout}">
						<img th:src="@{/static/images/web_images/header/logout_i.png}" alt="">
					</a>
				</div>
				<div th:if="${session.user == null}" class="header__icon-wide">
					<a th:href="@{/login}">
						<img th:src="@{/static/images/web_images/header/login_i.png}" alt="">
					</a>
				</div>
			</div>
			<div class="col-1 d-none d-xl-block"></div>
		</div>
		<div class="row justify-content-center align-items-center g-1 text-center">
			<div class="col-3 d-none d-xl-block"></div>
			<div class="header__nav col">
				<a th:href="@{/}">
					<img th:src="@{/static/images/web_images/header/top_i.png}" alt="">
				</a>
			</div>
			<div class="header__nav col">
				<a th:href="@{/client/item/list}">
					<img th:src="@{/static/images/web_images/header/items_i.png}" alt="">
				</a>
			</div>
			<div class="header__nav col">
				<a th:href="@{/client/basket/list}">
					<img th:src="@{/static/images/web_images/header/cart_i.png}" alt="">
				</a>
			</div>
			<div class="header__nav col">
				<a th:href="@{/client/order/list}">
					<img th:src="@{/static/images/web_images/header/orders_i.png}" alt="">
				</a>
			</div>
			<div class="col-3 d-none d-xl-block"></div>
		</div>
		<svg width="100%" height="3">
			<line x1="0" y1="100%" x2="100%" y2="100%" stroke="grey" stroke-width="3" />
		</svg>

		<!-- <div>
		<ul class="nav nav-tabs nav-justified 	">
			<li class="nav-item">
				<a class="nav-link active" href="#">Top</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="#">Item</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="#">Cart</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="#">Orders</a>
			</li>
		</ul>

	</div> -->
	</div>
</body>

</html>

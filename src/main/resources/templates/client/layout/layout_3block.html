<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title,body)">
<head th:replace="client/layout/head :: head_fragment()"></head>
<body
	th:classappend="${(session.user != null and (session.user.authority == 0 or session.user.authority == 1)) ? 'admin' : 'user' }">
	<!--/* ヘッダー */-->
	<header>
		<div th:replace="~{client/layout/header :: layout-header}"></div>
	</header>

	<!--/* メイン */-->
	<article class="text-center align-items-center">
		<div th:replace="${body}"></div>
	</article>

	<!--/* フッター */-->
	<footer>
		<div th:replace="~{client/layout/footer :: layout-footer}"></div>
	</footer>
</body>

</html>

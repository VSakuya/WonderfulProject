<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
</head>

<body>
	<div th:fragment="layout-header" class="container-fluid">

		<div class="container-70">
			<div class="row justify-content-center align-items-center my-2 text-center">
				<div class="col-4 d-flex justify-content-start">
					<div class="header__icon">
						<img th:src="@{/static/images/web_images/header/search_i.png}" alt="">
					</div>
				</div>
				<div class="col-4 header__title">
					<a th:href="@{/}">
						<img th:src="@{/static/images/web_images/header/wondermen_i.png}" alt="">
					</a>
				</div>
				<div class="col-4 d-flex justify-content-end">
					<div class="header__icon" th:if="${session.user != null}">
						<a th:href="@{/client/user/detail}">
							<img th:src="@{/static/images/web_images/header/mypage2_i.png}" alt="">
						</a>
					</div>
					<div class="header__icon-wide" th:if="${session.user != null}">
						<a th:href="@{/logout}">
							<img th:src="@{/static/images/web_images/header/logout_i.png}" alt="">
						</a>
					</div>
					<div th:if="${session.user == null}" class="header__icon-wide">
						<a th:href="@{/login}">
							<img th:src="@{/static/images/web_images/header/login_i.png}" alt="">
						</a>
					</div>
				</div>
			</div>
		</div>

		<svg width="100%" height="3">
			<line x1="0" y1="100%" x2="100%" y2="100%" stroke="grey" stroke-width="3" />
		</svg>

	</div>
</body>

</html>

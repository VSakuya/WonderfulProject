<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(title,body)">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.min.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet_client.css}" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
<script th:src="@{/js/jquery-3.7.0.min.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<title th:replace="${title}">シェアードショップ</title>
</head>
<body class="user">
	<!--/* ヘッダー */-->
	<header>
		<div th:replace="~{client/layout/header_nav :: layout-header}"></div>
	</header>
	<div class="container-90 row">
		<!--/* サイドバー */-->
		<aside class="col-2" th:replace="~{client/layout/sidebar :: layout-sidebar}">
		</aside>
		<!--/* メイン */-->
		<article class="col-10">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer>
		<div th:replace="~{client/layout/footer :: layout-footer}"></div>
	</footer>
</body>
</html>

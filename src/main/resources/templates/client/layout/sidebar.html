<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>
<aside th:fragment="layout-sidebar" class="col-2">
	<div  class="sidebar-container">
		<div class="container-fluid align-items-center">
			<img th:src="@{/static/images/web_images/title/category_i.png}" alt="">
		</div>
		<div class="text-center sidebar__categories-con">
			<a th:each="category: ${categories}" th:text="${category.name}" th:href="@{/client/item/list_temp(categoryId=${category.id})}" class="list-group-item list-group-item-action"></a>
		</div>

	</div>

</aside>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:fragment="layout(title,body)">
<head th:replace="client/layout/head :: head_fragment()"></head>
<body class="user">
	<!--/* ヘッダー */-->
	<header>
		<div th:replace="~{client/layout/header :: layout-header}"></div>
	</header>
	<!--/* ナビゲーションバー */-->
	<nav th:if="${session.user == null or session.user.authority == 2}" class="navi_area">
		<div th:replace="~{client/layout/menu :: layout-menu}"></div>
	</nav>
	<div class="container">
		<!--/* サイドバー */-->
		<aside th:replace="~{client/layout/sidebar :: layout-sidebar}"></aside>
		<!--/* メイン */-->
		<article class="main">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer>
		<div th:replace="~{client/layout/footer :: layout-footer}"></div>
	</footer>
</body>
</html>

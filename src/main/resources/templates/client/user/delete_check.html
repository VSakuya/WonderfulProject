<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.delete.check}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 class="title" th:text="#{title.delete.check}"></h2>
	<p class="check_message">以下の会員の退会手続きを行います。</p>
	<div class="user_info_form_area container-40">
		<div class="table-responsive">
			<table class="table table-hover table-striped">
				<tbody>
					<tr>
						<th>[[#{userForm.email}]]</th>
						<td th:text="${session.userForm.email}"></td>
					</tr>
					<tr>
						<th>[[#{userForm.name}]]</th>
						<td th:text="${session.userForm.name}"></td>
					</tr>
					<tr>
						<th>[[#{userForm.postalCode}]]</th>
						<td th:text="${session.userForm.postalCode}"></td>
					</tr>
					<tr>
						<th>[[#{userForm.address}]]</th>
						<td th:text="${session.userForm.address}"></td>
					</tr>
					<tr>
						<th>[[#{userForm.phoneNumber}]]</th>
						<td th:text="${session.userForm.phoneNumber}"></td>
					</tr>
				</tbody>
			</table>
		</div>
		<div class="mt-4">
			<form method="post" th:action="@{/client/user/delete/complete}">
				<input type="submit" value="退会" class="btn btn-danger btn-lg" />
			</form>
			<form method="post" th:action="@{/client/user/detail}">
				<input type="submit" value="戻る" class="btn btn-dark btn-lg" />
			</form>
		</div>
	</div>

</body>

</html>

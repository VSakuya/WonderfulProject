<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.update.check}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 class="title" th:text="#{user} + #{title.update.check}"></h2>
	<p class="check_message">以下の内容にて変更します。</p>
	<div class="user_info_form_area">
		<ul class="input_list">
			<li><span class="input_title">[[#{userForm.email}]]</span>
				<span class="input_value" th:text="${session.userForm.email}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.name}]]</span>
				<span class="input_value" th:text="${session.userForm.name}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.postalCode}]]</span>
				<span class="input_value" th:text="${session.userForm.postalCode}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.address}]]</span>
				<span class="input_value" th:text="${session.userForm.address}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.phoneNumber}]]</span>
				<span class="input_value" th:text="${session.userForm.phoneNumber}"></span>
			</li>
		</ul>
		<input type="hidden" name="authority" value="2" />
		<form method="post" th:action="@{/client/user/update/complete}">
			<input type="submit" value="登録" class="send_button" />
		</form>
		<form method="post" th:action="@{/client/user/update/input}">
			<input type="submit" value="戻る" class="back_button" />
		</form>
	</div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>会員新規登録</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 th:class="page_title" th:text="#{title.input.new}"></h2>
	<form method="post" th:action="@{/client/user/regist/input}">
		<ul>
			<li>
				<label><span th:class="input_title">メールアドレス</span></label>
				<input type="text" name="email" value="" id="email" />
			</li>
			<li>
				<label><span th:class="input_title">パスワード</span></label>
				<input type="password" name="password" value="" />
			</li>
			<li>
				<label><span th:class="input_title">氏名</span></label>
				<input type="text" name="name" value="" />
			</li>
			<li>
				<label><span th:class="input_title">郵便番号</span></label>
				<input type="text" name="postalCode" value="" />
			</li>
			<li>
				<label><span th:class="input_title">住所</span></label>
				<textarea name="address" rows="6"></textarea>
			</li>
			<li>
				<label><span th:class="input_title">電話番号</span></label>
				<input type="text" name="phoneNumber" value="" />
			</li>
		</ul>
		<input type="hidden" name="authority" value="2" />
		<input type="submit" value="確認" />
	</form>
	<form>
		<form method="post" th:action="@{/}">
			<input type="submit" value="戻る" />
		</form>
</body>

</html>

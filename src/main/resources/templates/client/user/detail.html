<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{user} + #{title.detail}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 class="title" th:text="#{user} + #{title.detail}"></h2>
	<div class="info_form_area">
		<div class="detail_list">
			<ul class="input_list">
				<li>
					<span class="input_title">[[#{userForm.email}]]</span>
					<span class="input_value" th:text="${user.email}"></span>
				</li>
				<li>
					<span class="input_title">[[#{userForm.name}]]</span>
					<span class="input_value" th:text="${user.name}"></span>
				</li>
				<li>
					<span class="input_title">[[#{userForm.postalCode}]]</span>
					<span class="input_value" th:text="${user.postalCode}"></span>
				</li>
				<li>
					<span class="input_title">[[#{userForm.address}]]</span>
					<span class="input_value" th:text="${user.address}"></span>
				</li>
				<li>
					<span class="input_title">[[#{userForm.phoneNumber}]]</span>
					<span class="input_value" th:text="${user.phoneNumber}"></span>
				</li>
			</ul>
		</div>
		<div class="detail_button_area">
			<form method="post" th:action="@{/}">
			<input type="submit" value="戻る" class="back_button" />
			</form>
			<form method="post" th:action="@{/client/user/update/input}">
			<input type="submit" value="変更" />
			</form>
			<form method="post" th:action="@{/client/user/delete/check}">
			<input type="submit" value="退会" class="delete" />
			</form>
		</div>
	</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{user} + #{title.detail}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 class="title" th:text="#{user} + #{title.detail}"></h2>
	<div class="info_form_area">
		<div class="container-40">
			<div class="table-responsive">
				<table class="table table-hover table-striped">
					<tbody>
						<tr>
							<th>[[#{userForm.email}]]</th>
							<td th:text="${user.email}"></td>
						</tr>
						<tr>
							<th>[[#{userForm.name}]]</th>
							<td th:text="${user.name}"></td>
						</tr>
						<tr>
							<th>[[#{userForm.postalCode}]]</th>
							<td th:text="${user.postalCode}"></td>
						</tr>
						<tr>
							<th>[[#{userForm.address}]]</th>
							<td th:text="${user.address}"></td>
						</tr>
						<tr>
							<th>[[#{userForm.phoneNumber}]]</th>
							<td th:text="${user.phoneNumber}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="detail_button_area">
			<form method="post" th:action="@{/client/user/update/input/init}">
				<input type="submit" value="変更" class="btn btn-dark btn-lg" />
			</form>
			<form method="get" th:action="@{/client/favorite/list}">
				<input type="submit" value="お気に入り" class="btn btn-secondary btn-lg" />
			</form>
			<button class="btn btn-light btn-lg" onclick="history.back()">戻る</button>
			<form method="post" th:action="@{/client/user/delete/check}">
				<input type="submit" value="退会" class="btn btn-light btn-lg" />
			</form>
		</div>
	</div>

</body>

</html>

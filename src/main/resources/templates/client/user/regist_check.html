<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.input.check}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<div class="user_info_form_area">
		<h2 th:class="title" th:text="#{msg.regist.check}"></h2>
		<p th:class="input_message">以下の内容で登録します。</p>
		<ul class="input_list">
			<li><span class="input_title">[[#{userForm.email}]]</span>
				<span th:text="${session.userForm.email}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.name}]]</span>
				<span th:text="${session.userForm.name}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.postalCode}]]</span>
				<span th:text="${session.userForm.postalCode}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.address}]]</span>
				<span th:text="${session.userForm.address}"></span>
			</li>
			<li><span class="input_title">[[#{userForm.phoneNumber}]]</span>
			<span th:text="${session.userForm.phoneNumber}"></span></li>
		</ul>
		<form method="post" th:action="@{/client/user/regist/complete}">
			<input type="submit" value="登録" class="send_button" />
		</form>
		<form method="post" th:action="@{/client/user/regist/input}">
			<input type="submit" value="戻る" class="back_button" />
		</form>
	</div>
</body>

</html>

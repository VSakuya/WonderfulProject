<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.delete.complete}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="user">
	<div class="p-3">
		<h3 th:text="#{title.delete.complete}"></h3>
		<h4 class="m-4">退会手続きが完了しました。</h4>
		<h4 class="countdown m-4" data-duration="5" th:data-target-url="@{/}">自動的に<span class="countdown-time">5</span>秒内後に<a th:href="@{/}">トップへ</a>戻る</h4>
	</div>
</body>
</html>

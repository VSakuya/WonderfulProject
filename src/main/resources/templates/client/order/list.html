<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{order}+#{title.list}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="client order_list_client">
	<h2 th:class="title" th:text="#{order}+#{title.list}"></h2>
	<!--/* 登録なしメッセージ */-->
	<div th:if="${#lists.isEmpty(orders)}">
		<p th:text="#{msg.admin.list.none(#{order})}"></p>
	</div>
	<!--/* 一覧表示 */-->
	<div class="list container-70" th:if="!${#lists.isEmpty(orders)}">
		<table class="table table-striped table-hover">
			<tr>
				<th>[[#{data.order.date}]]</th>
				<th>[[#{data.paymethod}]]</th>
				<th>[[#{data.total.price}]]</th>
			</tr>
			<tr th:each="order: ${orders}">
				<td>
					<a th:href="@{/client/order/detail/{id}(id=${order.id})}" th:text="${order.insertDate}"></a>
				</td>
				<td th:switch="${order.payMethod}">
					<span th:case="1">[[#{paymethod.credit.str}]]</span>
					<span th:case="2">[[#{paymethod.bank.str}]]</span>
					<span th:case="3">[[#{paymethod.onarrival.str}]]</span>
					<span th:case="4">[[#{paymethod.emoney.str}]]</span>
					<span th:case="5">[[#{paymethod.convenience.str}]]</span>
				</td>
				<td th:text="${order.total}"></td>
			</tr>
		</table>
		<div class="d-flex justify-content-center container-fluid align-items-center text-center">
			<ul class="pagination">
				<li class="page-item" th:classappend="${pages.number le 0 ? 'disabled' : ''}">
					<a class="page-link" th:href="@{${url}(page=${pages.number - 1})}">
						&lt;</a>
				</li>
				<li class="page-item" th:each="i : ${#numbers.sequence(0, pages.totalPages - 1)}"
					th:classappend="${pages.number == i ? 'active' : ''}">
					<a class="page-link" th:text="${i+1}" th:href="@{${url}(page=${i})}">2</a>
				</li>
				<li class="page-item" th:classappend="${pages.number >= (pages.totalPages - 1) ? 'disabled' : ''}">
					<a class="page-link" th:href="@{${url}(page=${pages.number + 1})}">&gt;</a>
				</li>
			</ul>
		</div>
		<!--/* ページリンク */-->
		<!-- <ul class="paging" th:if="!${#lists.isEmpty(orders)}">
			<li th:class="${pages.first} ? 'disabled':''">

			</li>

				</a>
			</li>
			<li th:class="${pages.last} ? 'disabled':''">

			</li>
		</ul> -->
	</div>
</body>

</html>

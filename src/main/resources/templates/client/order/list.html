<!DOCTYPE html>
<html>
<head>
	<title>
		注文一覧 | シェアードショップ
	</title>
	<meta name="referrer" content="unsafe-url" />
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" href="css/layout.css" />
	<link rel="stylesheet" type="text/css" href="css/stylesheet.css" />
</head>
<body class="user">
	<header>
		<div class="container">
			<h1 class="site_title">
				シェアードショップ
			</h1>
			<div class="user_info">
				<a href="/shared_shop/client/user/detail">
					一般三郎
				</a>
				さん |
				<a href="/shared_shop/logout">
					ログアウト
				</a>
			</div>
		</div>
	</header>
	<nav class="navi_area">
		<ul class="navi_menu">
			<li>
				<a href="/shared_shop/">
					トップ
				</a>
			</li>
			<li>
				<a href="/shared_shop/client/item/list/1">
					商品一覧
				</a>
			</li>
			<li>
				<a href="/shared_shop/client/basket/list">
					買い物かご
				</a>
			</li>
			<li>
				<a href="/shared_shop/client/order/list">
					注文一覧
				</a>
			</li>
		</ul>
	</nav>
	<div class="container">
		<aside class="search">
			<div class="search_area">
				<h2 class="title">
					カテゴリ検索
				</h2>
				<div class="form">
					<form action="/shared_shop/client/item/list/1">
						<select name="categoryId">
							<option value="0">
								--指定なし--
							</option>
							<option value="2">
								書籍
							</option>
							<option value="1">
								食料品
							</option>
							<option value="15">
								キッチン用品
							</option>
							<option value="13">
								アクセサリ
							</option>
							<option value="10">
								OA用品
							</option>
							<option value="12">
								手芸用品
							</option>
							<option value="9">
								飲み物
							</option>
							<option value="8">
								ネットワーク機器
							</option>
							<option value="6">
								掃除用具
							</option>
							<option value="5">
								文房具
							</option>
							<option value="7">
								食器
							</option>
							<option value="3">
								乗り物
							</option>
						</select>
						<input type="submit" value="検索" />
					</form>
				</div>
			</div>
		</aside>
		<article class="main">
			<!-- 購入情報 -->
			<th:block th:if="*{orderItemBeanList != null and orderItemBeanList.size() > 0}">
				<div class="header border-bottom">
					<h1 class="h2">購入履歴</h1>
				</div>
				<table class="table table-striped table-bordered table-hover">
					<thead>
						<tr>
							<th>購入日</th>
							<th>支払方法</th>
							<th>購入金額</th>
		
						</tr>
					</thead>
					<tbody>
						<tr th:each="items : *{orderItemBeanList}">
							<td th:text="${#dates.format(items.insertDate, 'YYYY/MM/dd')}"></td>
							<td th:text="${items.payMethod}"></td>
							<td th:text="${items.price * orderItems.count}"></td>
						</tr>
					</tbody>
				</table>
			</th:block>
		</article>
	</div>
	<footer>
		<small class="container">
			Copyright(C) System Shared co., ltd, ALL Rights Reserved
		</small>
	</footer>
</body>
</html>

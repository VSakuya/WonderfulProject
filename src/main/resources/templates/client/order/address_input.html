	th:replace="~{client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.order.address.input}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 th:class="title" th:text="#{title.order.address.input}"></h2>
	<p th:class="input_message" th:text="#{msg.order.address.input}"></p>

	<div class="user_info_form_area" th:object=${userForm}>
		<div class="container-40">
			<form method="post" th:action="@{/client/order/payment/input}" class="user_info_form">
				<div class="row mb-3 mt-3">
					<label for="postalCode" class="col-sm-4 col-form-label">[[#{orderForm.postalCode}]]</label>
					<div class="col-sm-8">
						<input type="text" name="postalCode" class="form-control" id="postalCode" th:value="${session.orderForm.postalCode}" required>
					</div>
				</div>
				<div class="row mb-3 mt-3">
					<label for="address" class="col-sm-4 col-form-label">[[#{orderForm.address}]]</label>
					<div class="col-sm-8">
						<textarea rows="6" name="address" class="form-control" id="address" required>[[${session.orderForm.address}]]</textarea>
					</div>
				</div>
				<div class="row mb-3 mt-3">
					<label for="name" class="col-sm-4 col-form-label">[[#{orderForm.name}]]</label>
					<div class="col-sm-8">
						<input type="text" class="form-control" name="name" id="name" th:value="${session.orderForm.name}" required>
					</div>
				</div>
				<div class="row mb-3 mt-3">
					<label for="phoneNumber" class="col-sm-4 col-form-label">[[#{orderForm.phoneNumber}]]</label>
					<div class="col-sm-8">
						<input type="text" class="form-control" id="phoneNumber" name="phoneNumber" th:value="${session.orderForm.phoneNumber}" required>
					</div>
				</div>
				<input type="submit" value="確認" class="btn btn-dark btn-lg" />
			</form>
			<form method="get" th:action="@{/client/basket/list}">
				<input type="submit" value="戻る" class="btn btn-lg btn-light" />
			</form>

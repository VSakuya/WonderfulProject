<head>

	<div class="user_info_form_area">
		<form method="post" th:action="@{/client/order/payment/input}" class="user_info_form">

				<li>>					<label><span class="input_title">[[#{orderForm.postalCode}]]</span></label>

					<input type="text" th:value="${ex.postalCode}" />

				<li>
					<label><span class="input_title">[[#{orderForm.address}]]</span></label><br />

					<textarea rows="6">[[${ex.address}]]</textarea>
				</li>
				<li>
					<label><span class="input_title">[[#{orderForm.name}]]</span></label>

					<input type="text" th:value="${ex.name}" />
				</li>
				<li>
					<label><span class="input_title">[[#{orderForm.phoneNumber}]]</span></label>

					<input type="text" th:value="${ex.phoneNumber}" />
				</li>
			</ul>

		</form>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
	<meta charset="UTF-8">
	<title th:text="#{title.input.new}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<h2 th:class="title" th:text="#{title.order.address.input}"></h2>
	<p th:class="input_message" th:text="#{msg.order.address.input}"></p>
	<div class="user_info_form_area">
		<form method="post" th:action="@{/client/order/payment/input}" class="user_info_form">
			<ul class="input_list">
				<li>
					<label><span class="input_title">[[#{orderForm.postalCode}]]</span></label>

					<input type="text" name="postalCode" th:value="${session.orderForm.postalCode}" />
				</li>
				<li>
					<label><span class="input_title">[[#{orderForm.address}]]</span></label><br />

					<textarea rows="6" name="address">[[${session.orderForm.address}]]</textarea>
				</li>
				<li>
					<label><span class="input_title">[[#{orderForm.name}]]</span></label>

					<input type="text" name="name" th:value="${session.orderForm.name}" />
				</li>
				<li>
					<label><span class="input_title">[[#{orderForm.phoneNumber}]]</span></label>

					<input type="text" name="phoneNumber" th:value="${session.orderForm.phoneNumber}" />
				</li>
			</ul>
			<input type="hidden" name="authority" value="2" />
			<input type="submit" value="確認" class="send_button" />
		</form>

		<form method="get" th:action="@{/client/basket/list}">
			<input type="submit" value="戻る" class="back_button" />
		</form>
	</div>
</body>
</html>

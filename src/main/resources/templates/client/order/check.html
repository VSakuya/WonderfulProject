<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.input.new}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<div class="container-70">
		<h2 class="title" th:text="#{title.order.check}">
		</h2>
		<br />
		<table class="table table-hover table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th th:text="#{data.item.name}">
					</th>
					<th th:text="#{data.item.image}">
					</th>
					<th th:text="#{data.unit.price}">
					</th>
					<th th:text="#{data.order.num}">
					</th>
					<th th:text="#{data.subtotal}">
					</th>
				</tr>
			</thead>
			<tr th:each="item: ${session.orderItems}">
				<td th:text="${item.name}">
				</td>
				<td>
				<img th:src="@{/static/images/} + ${item.image}" th:if="${item.image != null}" />
				<img th:src="@{/images/common/no_image.jpg}" th:if="${item.image == null}" />
				</td>
				<td th:text="${item.price}">
				</td>
				<td th:text="${item.orderNum}">
				</td>
				<td th:text="(${item.price}*${item.orderNum})">
				</td>
			</tr>
			<tr>
				<td colspan="3"></td>
				<td class="total" th:text="#{data.total}">
				</td>
				<td class="total" th:text="${total}">
				</td>
			</tr>
		</table>
		<div class="user_info_form_area">
			<caption class="table_caption">
				<h2 th:text="#{data.address}"></h2>
			</caption>
			<table class="table table-hover table-striped table-bordered">
				<tr>
					<th th:text="#{orderForm.postalCode}" class="table-dark">
					</th>
					<td th:text="${session.orderForm.postalCode}">
					</td>
				</tr>
				<tr>
					<th th:text="#{orderForm.address}" class="table-dark">
					</th>
					<td th:text="${session.orderForm.address}">
					</td>
				</tr>
				<tr>
					<th th:text="#{orderForm.name}" class="table-dark">
					</th>
					<td th:text="${session.orderForm.name}">
					</td>
				</tr>
				<tr>
					<th th:text="#{orderForm.phoneNumber}" class="table-dark">
					</th>
					<td th:text="${session.orderForm.phoneNumber}">
					</td>
				</tr>
			</table>

			<caption class="table_caption">
				<h2 th:text="#{paymethod.str}"></h2>
			</caption>
			<table class="table table-hover table-striped table-bordered">
				<tr>
					<th th:text="#{paymethod.str}" class="table-dark">
					</th>
					<td th:switch="${session.orderForm.payMethod}">
						<span th:case="1" th:text="#{paymethod.credit.str}"></span>
						<span th:case="2" th:text="#{paymethod.bank.str}"></span>
						<span th:case="3" th:text="#{paymethod.onarrival.str}"></span>
						<span th:case="4" th:text="#{paymethod.emoney.str}"></span>
						<span th:case="5" th:text="#{paymethod.convenience.str}"></span>
					</td>
				</tr>
			</table>
			<div class="container-fluid justify-content-end d-flex">
				<form method="post" th:action="@{/client/order/check/back}" class="update">
					<input type="submit" value="戻る" class="btn btn-light btn-lg" />
				</form>
				<form method="post" th:action="@{/client/order/complete}">
					<input class="btn btn-dark btn-lg" type="submit" value="ご注文の確定" />
				</form>
			</div>
		</div>
	</div>
</body>

</html>

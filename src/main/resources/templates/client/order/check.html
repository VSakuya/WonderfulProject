<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.input.new}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<article class="main">
				<h2 class="title">
					注文内容確認
				</h2>
				<br />
				<table class="list_table item_detail">
					<tr>
						<th th:text="#{data.item.name}">
						</th>
						<th th:text="#{data.item.image}">
						</th>
						<th th:text="#{data.unit.price}">
						</th>
						<th th:text="#{data.order.num}">
						</th>
						<th th:text="#{data.subtotal}">
						</th>
					</tr>
					<tr th:each="item: ${session.orderItems}">
						<td th:text="${item.item.name}">
						</td>
						<td>
							<img th:src="@{/static/images/} + ${item.item.imageList[0].imagePath}"　th:if="${item.item.imageList[0].imagePath != null}" />
					<img th:src="@{/images/common/no_image.jpg}" th:if="${item.item.imageList[0].imagePath == null}" />
						</td>
						<td th:text="${item.price}">
						</td>
						<td th:text="${item.quantity}">
						</td>
						<td th:text="(${item.price}*${item.quantity})">
						</td>
					</tr>
					<tr>
						<td colspan="3"></td>
						<td class="total">
							合計
						</td>
						<td class="total" th:text="${total}">
						</td>
					</tr>
				</table>
				<div class="user_info_form_area">
					<table class="detail_table address">
						<caption class="table_caption">
							お届け先
						</caption>
						<tr>
							<th>
								郵便番号
							</th>
							<td th:text="${session.ex.postalCode}">
							</td>
						</tr>
						<tr>
							<th>
								住所
							</th>
							<td th:text="${session.ex.address}">
							</td>
						</tr>
						<tr>
							<th>
								氏名
							</th>
							<td th:text="${session.ex.name}">
							</td>
						</tr>
						<tr>
							<th>
								電話番号
							</th>
							<td th:text="${session.ex.phoneNumber}">
							</td>
						</tr>
					</table>
					<table class="detail_table pay">
						<caption class="table_caption">
							お支払い方法
						</caption>
						<tr>
							<th>
								お支払い方法
							</th>
							<td th:switch="${session.ex.payMethod}">
								<span th:case="1">クレジットカード</span>
								<span th:case="2">銀行振込</span>
								<span th:case="3">着払い</span>
								<span th:case="4">電子マネー</span>
								<span th:case="5">コンビニ決済</span>
							</td>
						</tr>
					</table>
					<form method="post" th:action="@{/client/order/complete}" >
						<input class="send_button" type="submit" value="ご注文の確定" />
					</form>
					<form method="post" th:action="@{/client/order/payment/input}" class="update">
						<input type="submit" value="戻る" class="back_button"/>
					</form>
				</div>
			</article>
</body>

</html>

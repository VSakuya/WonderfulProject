<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title th:text="#{title.input.new}+' | '+ #{shop.title}"></title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="user">
	<article class="main">
				<h2 class="title" th:text="#{title.order.check}">
				</h2>
				<br />
				<table class="list_table item_detail">
					<tr>
						<th th:text="#{data.item.name}">
						</th>
						<th th:text="#{data.item.image}">
						</th>
						<th th:text="#{data.unit.price}">
						</th>
						<th th:text="#{data.order.num}">
						</th>
						<th th:text="#{data.subtotal}">
						</th>
					</tr>
					<tr th:each="item: ${session.orderItems}">
						<td th:text="${item.name}">
						</td>
						
						<!--
						<td>
							<img th:src="@{/static/images/} + ${item.item.imageList[0].imagePath}"　th:if="${item.item.imageList[0].imagePath != null}" />
					<img th:src="@{/images/common/no_image.jpg}" th:if="${item.item.imageList[0].imagePath == null}" />
						</td>
						-->
						<td>画像</td>
						<td th:text="${item.price}">
						</td>
						<td th:text="${item.orderNum}">
						</td>
						<td th:text="(${item.price}*${item.orderNum})">
						</td>
					</tr>
					<tr>
						<td colspan="3"></td>
						<td class="total" th:text="#{data.total}">
						</td>
						<td class="total" th:text="${total}">
						</td>
					</tr>
				</table>
				<div class="user_info_form_area">
					<caption class="table_caption">
						<p th:text="#{data.address}"></p>
					</caption>
					<table class="detail_table address">
						<tr>
							<th th:text="#{orderForm.postalCode}">
							</th>
							<td th:text="${session.orderForm.postalCode}">
							</td>
						</tr>
						<tr>
							<th th:text="#{orderForm.address}">
							</th>
							<td th:text="${session.orderForm.address}">
							</td>
						</tr>
						<tr>
							<th th:text="#{orderForm.name}">
							</th>
							<td th:text="${session.orderForm.name}">
							</td>
						</tr>
						<tr>
							<th th:text="#{orderForm.phoneNumber}">
							</th>
							<td th:text="${session.orderForm.phoneNumber}">
							</td>
						</tr>
					</table>
					
					<caption class="table_caption">
							<p th:text="#{paymethod.str}"></p>
					</caption>
					<table class="detail_table pay">
						<tr>
							<th th:text="#{paymethod.str}">
							</th>
							<td th:switch="${session.orderForm.payMethod}">
								<span th:case="1" th:text="#{paymethod.credit.str}"></span>
								<span th:case="2" th:text="#{paymethod.bank.str}"></span>
								<span th:case="3" th:text="#{paymethod.onarrival.str}"></span>
								<span th:case="4" th:text="#{paymethod.emoney.str}"></span>
								<span th:case="5" th:text="#{paymethod.convenience.str}"></span>
							</td>
						</tr>
					</table>
					<form method="post" th:action="@{/client/order/complete}" >
						<input class="send_button" type="submit" value="ご注文の確定" />
					</form>
					<form method="post" th:action="@{/client/order/check/back}" class="update">
						<input type="submit" value="戻る" class="back_button"/>
					</form>
				</div>
			</article>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{title.order.complete}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="client order_complete">
	<h3 th:text="#{title.order.complete}"></h3>
	<h4 class="m-4" th:text="#{msg.order.complete1}"></h4>
	<h4 class="m-4" th:text="#{msg.order.complete2}"></h4>
	<h4 class="countdown m-4" data-duration="5" th:data-target-url="@{/}">自動的に<span
			class="countdown-time">5</span>秒内後に<a th:href="@{/}">トップへ</a>戻る</h4>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"　th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title　th:text="#{favorite.list}+' | '+ #{shop.title}"> </title>
</head>
<body>
	<h2 class=title th:text="#{favorite.list}">
	</h2>
	<!-- お気に入り登録した商品がない場合　メッセージ表示 -->
	<div th:if="${items == null}" th:text="#{msg.favorite.list.none}">
	</div>
	<!--   お気に入り登録した商品が存在する場合   -->
	<th:block th:if="${items != null}">
		<table class="list_table item_detail">
		
			<tr>
				<th th:text="#{data.item.image}">
				</th>
				<th th:text="#{data.item.name}">
				</th>
				<th th:text="#{data.item.price}">
				</th>
				<th th:text="#{data.category}">
				</th>
			</tr>
			
			<tr th:each="item: ${items}">
				
				<td th:each="imagepath: ${imagePath}">
					<img th:src="@{/static/images/{image}(image=${imagepath})}" th:if="${imagepath != null}" />
					<img th:src="@{/images/common/no_image.jpg}" th:if="${imagepath == null}" />
				</td>
				
				
				<td>
				<a th:href="@{/client/item/detail/{id}(id=${item.id})}" th:text="${item.item.name}"> </a>
				</td>
				<td th:text="${item.item.price}">
				</td>
				<td th:text="${item.item.category.name}">
				</td>
			</tr>
						
		</table>
	<th:block>
</body>
</html>

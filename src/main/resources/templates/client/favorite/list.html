<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title th:text="#{favorite.list}+' | '+ #{shop.title}"> </title>
</head>
<body>
	<div class="container-60">
		<h2 class=title th:text="#{favorite.list}">
		</h2>
		<!-- お気に入り登録した商品がない場合　メッセージ表示 -->
		<div th:if="${items == null}" th:text="#{msg.favorite.list.none}">
		</div>
		<!--   お気に入り登録した商品が存在する場合   -->
		<div th:if="${items != null}">
			<table class="table table-hover table-striped table-bordered align-middle">
				<tr>
					<th th:text="#{data.item.image}">
					</th>
					<th th:text="#{data.item.name}">
					</th>
					<th th:text="#{data.item.price}">
					</th>
					<th th:text="#{data.category}">
					</th>
					<th th:text="#{basket}">
					</th>
				</tr>
				<tr th:each="item, stat: ${items}">
					<!-- <td>
						<img th:src="@{/images/} + ${item.item.imageList[0].imagePath}" th:if="${item.item.imageList[0].imagePath != null}" />
						<img th:src="@{/images/common/no_image.jpg}" th:if="${item.item.imageList[0].imagePath == null}" />
					</td> -->
					<td class="icon-small">
						<div class="icon-medium block-center">
							<a th:href="@{/client/item/detail/{id}(id=${item.item.id})}">
								<img th:src="@{/images/} + ${item.item.imageList[0].imagePath}" th:if="${item.item.imageList[0].imagePath != null}" />
								<img th:src="@{/images/common/no_image.jpg}" th:if="${item.item.imageList[0].imagePath == null}" />
							</a>
						</div>
					</td>
					<td>
						<h3>
							<a th:href="@{/client/item/detail/{id}(id=${item.item.id})}" th:text="${item.item.name}"> </a>
						</h3>
					</td>
					<td th:text="${item.item.price}">
					</td>
					<td th:text="${item.item.category.name}">
					</td>
					<td>
						<form th:action="@{/client/basket/add}" , method="post">
							<input type="hidden" name="id" th:value="${item.item.id}">
							<button type="submit" class="btn btn-dark btn-sm">
								買い物かごに入れる
								<!-- <img th:src="@{/static/images/web_images/button/add_i.png}" class="icon-img"/> -->
							</button>
							<!-- <input type="submit" value="買い物かごに入れる" class="send_button" /> -->
						</form>
					</td>
				</tr>
			</table>
		</div>
	</div>
</body>
</html>

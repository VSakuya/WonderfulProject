<!--
商品詳細画面
@author Wonder Wada
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
<title>商品詳細</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="user">
   <h2 class="title">商品詳細</h2>
     <div class="info_form_area" th:object="${items}">
     <div class="item_detail_area">
         <div class="item_image_area">
	     <img src = "@{/static/images/test1.jpg}">
	     </div>
	
         <dl class="item_detail_list">
           <dt>商品名</dt>
             <dd th:text="${session.items.name}"></dd>
           <dt>価格</dt>
             <dd th:text="${session.items.price}"></dd>
           <dt>在庫数</dt>
             <div th:if="${session.items.stock >= 6}">在庫あり</div>
             <th:block th:if="${session.items.stock le 5 && session.items.stock ge 1}">
               <dd th:text="${session.items.stock}"></dd>
             </th:block>
             
             <th:block th:if="${session.items.stock == 0}">
               <p>在庫なし</p>
             </th:block>
           <dt>カテゴリ</dt>
             <dd th:text="${session.items.categoryName}"></dd>
           <dt>説明文</dt>
             <dd th:text="${session.items.description}"></dd>
         </dl>
     </div>
     <div class="detail_button_area">
        <form th:action="@{/client/basket/add}", method="post">
        <input type="hidden" name="id" value= "${session.items.id}">
        <input type="submit" value="買い物かごに入れる" class="send_button"/>
        </form>
        
     	<form th:action="@{/client/item/list/1}" method="post">
	    <input type="submit" value="戻る" class="back_button" />
		</form>
     </div>
</div>
</body>

</html>

<!--
商品詳細画面
@author Tomita
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">

<head>
<title>商品詳細</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />


</head>

<body>
	<h2 class="title">新着商品</h2>
	

	<div class="container-50">
		<table class="table table-hover table-striped table-bordered align-middle">
			<tr>
				<th>連番</th>
				<th th:text="#{data.item.image}"></th>
				<th th:text="#{itemForm.name}"></th>
				<th th:text="#{itemForm.price}"></th>
			</tr>

			<tr th:each="item, status: ${itemList}">
				<td th:text="${status.count}"></td>
				<td>
					<div class="icon-medium block-center">
						<a th:href="@{/client/item/detail/} + ${item.id}">
							<img class="icon-img" th:src="@{/images/} + ${item.imageList[0].imagePath}" />
						</a>
					</div>
					<!--		 	<td><a th:href="@{/client/item/detail/{id}(id = ${items.id})}" th:text="${items.name}"></a></td>-->
				<td>
					<h2>
						<a th:href="@{/client/item/detail/} + ${item.id}" th:text="${item.name}"></a>
					</h2>
				</td>
				<td th:text="${item.price}"></td>
				<!--			 	<td th:text="${item.items.images.imagePath}"></td>-->
				<!--			<td><img th:src="@{/client/item/detail/{id}(id = ${item.items.id})}"></td>  -->

			</tr>


		</table>
	</div>

</body>
</html>

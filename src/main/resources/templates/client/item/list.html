<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>売れ筋順ページ</title>
    </head>
        <body class="user">
            <header>
                <div class="container">
                    <h1 class="site_title">WONDERMAN<h1>
                        <div class="user_info">
                        <!--非会員と一般会員によって「ログイン」「ログアウト」の条件分岐による表示-->
                          <!--非会員-->
                            <!-- ログイン画面へ遷移-->
                            <a th:href="@{/login}">ログイン</a>
                            <!-- 新規登録画面へ遷移-->
                            <a th:href="@{/client/user/regist/input/init}">新規会員登録</a>
                          <!--一般会員-->
                            <!--会員名の表示-->
                            <a th:href="@{client/user/detail}">
                              
                              
                            </a>
                            <!--「ログアウト」、ログイン画面に遷移-->
                            <a th:herf="@{/logout}">
                                ログアウト
                            </a>
                        </div>
                </div>
            </header>
            
            <nav class="nav_area">
                <ul class="navMenu">
                    <li><a th:href="@{/}">トップ</a></li>
                    <li><a th:href="@{/client/item}">商品一覧</a></li>
                    <li><a th:href="@{/client/basket/list}">買い物かご</a></li>
            　　</ul>  
            </nav> 
            <!--カテゴリ検索-->
            <div class="container">
            
                <aside class="search">
                
                    <div class="search_area">
                        <h2 class="title">カテゴリ検索</h2>
                            <!--カテゴリ名-->
                            <div calss="form">
                                <form th:action="@{client/item/list/}">
                                    <select name="categoryId">
                                        <option value="0" th:selected="${category_id==}">--指定なし--</option>
                                        <option value="1" th:selected="${category_id==}">アウター</option>
                                        <option value="2" th:selected="${category_id==}">トップス</option>
                                        <!--カテゴリが決まり次第記入-->
                                
                                     </select>
                                     <input type="submit" value="検索" />   
                                </form>
                             </div>
                     </div>        
                 </aside>    
                 <!--売れ筋順-->
                 <article class="main">
                     <div>
                         <h2 class="title">売れ筋商品</h2>
                     </div>
                     <!---売れ筋順商品の表示-->
                     	
                     

                     
                     
                                  
             
             
             
             
             
             
                  </article> 
              </div>
              <footer>
                  <small class="container">
                      Copyright(C) System Shared co., ltd, ALL Rights Reserved
                  </small>
              </footer>           
         </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{top}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user index">
	<h1>商品一覧</h1>
	<div class="" th:if="${#lists.size(items) le 0}">
		<br>
		<h1>
			申し訳ございません、当てはまる商品がありません。
		</h1>
	</div>
	<!-- <h1 th:text="${#lists.size(items)}"></h1> -->
	<div class="" th:if="${#lists.size(items) gt 0}">
		<ul class="row align-items-center">
			<li th:each="index, stat : ${#lists.size(items) ge 5 ? #numbers.sequence(0, 4) : #numbers.sequence(0, #lists.size(items) - 1) }"
				class="col-2">
				<div class="card" style="max-width:12vw">
					<img class="card-img-top" th:if="${!#lists.isEmpty(items[index].imageList)}"
						th:src="@{/static/images/} + ${items[index].imageList[0].imagePath}" alt="Card image">
					<img class="card-img-top" th:if="${#lists.isEmpty(items[index].imageList)}"
						th:src="@{/static/images/test1.jpg}" alt="Card image">
					<div class="card-body">
						<a th:href="@{/client/item/detail/} + ${items[index].id}">
							<span class="card-title" th:text="${items[index].name}">John Doe</span>
						</a>
						<br>
						<span>¥ </span>
						<span class="card-text" th:text="${items[index].price}">Some example text.</span>
					</div>
				</div>
			</li>
		</ul>
		<ul class="row align-items-center" th:if="${#lists.size(items) gt 5}">
			<li th:each="index, stat : ${#lists.size(items) == 10 ? #numbers.sequence(5, 9) : #numbers.sequence(5, #lists.size(items) - 1) }"
				class="col-2">
				<div class="card" style="max-width:12vw">
					<img class="card-img-top" th:if="${!#lists.isEmpty(items[index].imageList)}"
						th:src="@{/static/images/} + ${items[index].imageList[0].imagePath}" alt="Card image">
					<img class="card-img-top" th:if="${#lists.isEmpty(items[index].imageList)}"
						th:src="@{/static/images/test1.jpg}" alt="Card image">
					<div class="card-body">
						<a th:href="@{/client/item/detail/} + ${items[index].id}">
							<span class="card-title" th:text="${items[index].name}">John Doe</span>
						</a>
						<br>
						<span>¥ </span>
						<span class="card-text" th:text="${items[index].price}">Some example text.</span>
					</div>
				</div>
			</li>
		</ul>
		<div class="d-flex justify-content-center container-fluid align-items-center text-center">
			<ul class="pagination">
				<li class="page-item" th:classappend="${pageItems.number le 0 ? 'disabled' : ''}">
					<a class="page-link" th:href="@{/client/item/list_temp(page=${pageItems.number - 1})}"><</a>
				</li>
				<li class="page-item" th:each="i : ${#numbers.sequence(0, pageItems.totalPages - 1)}" th:classappend="${pageItems.number == i ? 'active' : ''}">
					<a class="page-link" th:text="${i+1}" th:href="@{/client/item/list_temp(page=${i})}">2</a>
				</li>
				<li class="page-item" th:classappend="${pageItems.number >= (pageItems.totalPages - 1) ? 'disabled' : ''}">
					<a class="page-link" th:href="@{/client/item/list_temp(page=${pageItems.number + 1})}">></a>
				</li>
			</ul>
		</div>
	</div>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
 th:replace="~{admin/layout/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>商品一覧画面</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" href="css/stylesheet.css">
</head>
<body class="user">
    <h2 class="title">商品一覧</h2>
    <div class="sorted_by">
					<span>
						新着順
					</span>
					<a th:href="@{/client/item/list/2}">
						売れ筋順
					</a>
				</div>
    <table class="list_table item_list" th:if="!${#lists.isEmpty(itemList)}">
    <tr>
        <td>商品画像</td>
        <td>商品名</td>
        <td>価格</td>
        <td>カテゴリ</td>
    </tr>
    <tr th:each="item : ${itemList}">
        <td class="item_image_area"><img th:src="@{/static/images/{path}(path = ${item.imagePath})}"/></td>
        <td><a th:href="@{/client/item/detail/{id}(id = ${item.items.id})}" th:text="${item.items.name}"></a></td>
        <td th:text="${item.items.price}"></td>
        <td th:text="${item.items.category.name}"></td>
    </tr>
    </table>
</body>
</html>

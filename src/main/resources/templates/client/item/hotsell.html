<!DOCTYPE html>

 th:replace="~{admin/layout/layout_5block :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>売れ筋商品画面</title>

<body class="user">
    <h2 class="title">売れ筋商品</h2>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">
    <head>
        <meta charset="UTF-8">
        <title th:text="#{sort.hotsell.str}"></title>
    </head>
    <body>
        <div>
	        <h2 class="title">
			    <span th:if="${sortType==1}" th:text="#{sort.latest.title}"></span>
			    <span th:if="${sortType==2 || sortType==null}" th:text="#{sort.hotsell.title}"></span>
	        </h2>
        </div>
             <!--売れ筋順-->
             <article class="main">
                 <table class="list_table item_detail">
                     <tr>
                         <th>No.</th>
                         <th th:text="#{data.item.image}"></th>
                         <th th:text="#{data.item.name}"></th>
                         <th th:text="#{data.item.price}"></th>
                     </tr>
                     <tr th:each="pranking, st:${ranking}">
                        <td th:text="${st. count}"></td>
                        <td><img th:src="@{/static/images/} + ${pranking.imageList[0].imagePath}"></td>
                        <td><a th:href="@{/client/item/detail/{id}(id=${pranking.id})}" th:text="${pranking.name}"></a></td>
                        <td th:text="${pranking.price}"></td>
                     </tr>
                 </table>
                 
          <!--<ul>
                  <li>
                      <span th:if="${pages.first}">&lt;&lt;</span> 
                      <a th:if="${not pages.first}" th:href="@{/client/item/list/2}" 
                  </li>
                  
                  <li th:each="i : ${#numbers.sequence(0, pass.totalPages-1)}">
                      <span th:if="${i}==${pages.number}" th:text="${i+1}"></span>
                      <a th:if="${i}==${pages.number}" th:href="@{/client/item/list/2(page=${i})}">
                  </li>     
                      -->   
              </article>   
              
                      
                      
              
              
              
              

     </body>
</html>

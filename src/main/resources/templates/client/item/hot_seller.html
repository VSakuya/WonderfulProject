<!--売れ筋商品
 @author inaba
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{client/layout/layout_3block_nav :: layout(~{::title},~{::body/content()})}">

<head>
    <meta charset="UTF-8">
    <title th:text="#{sort.hotsell.str}"></title>
</head>

<body>
    <h2 class="title">
        <span th:if="${sortType==1}" th:text="#{sort.latest.title}"></span>
        <span th:if="${sortType==2 || sortType==null}" th:text="#{sort.hotsell.title}"></span>
    </h2>
    <!--売れ筋順-->
    <div class="container-50">

        <table class="table table-hover table-striped table-bordered align-middle">
            <tr>
                <th>No.</th>
                <th th:text="#{data.item.image}"></th>
                <th th:text="#{data.item.name}"></th>
                <th th:text="#{data.item.price}"></th>
            </tr>
            <tr th:each="pranking, st:${items}">
                <td><h2 th:text="${st. count}"></h2></td>
                <td class="icon-small">
                    <div class="icon-medium block-center">
                        <a th:href="@{/client/item/detail/{id}(id=${pranking.id})}">
                            <img class="icon-img" th:src="@{/images/} + ${pranking.imageList[0].imagePath}">
                        </a>
                    </div>
                </td>
                <td>
                    <h2>
                        <a th:href="@{/client/item/detail/{id}(id=${pranking.id})}" th:text="${pranking.name}"></a>
                    </h2>
                </td>
                <td th:text="${pranking.price}"></td>
            </tr>
        </table>
    </div>


</body>

</html>

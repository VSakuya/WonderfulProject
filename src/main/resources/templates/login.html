<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{/client/layout/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{login}+' | '+ #{shop.title}"> </title>
</head>

<body class="user">

	<div class="justify-content-center align-items-center text-center container-40">
		<h2 th:class="page_title" th:text="#{login}"></h2>
		<p th:class="description" th:text="#{msg.login.input}"></p>
		<form th:action="@{/login}" method="post" class="login_form needs-validation" th:object="${loginForm}">
			<th:block th:if="${#fields.hasErrors()}">
				<div class="error_list alert alert-danger alert-dismissible text-center fade show">
					<ul class="list-unstyled">
						<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
					</ul>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
			</th:block>

			<div class="row mb-3 mt-3">
				<label for="email" class="col-sm-4 col-form-label">メールアドレス</label>
				<div class="col-sm-8">
					<input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="Enter email" required>
				</div>
				<div class="valid-feedback">問題なし</div>
				<div class="invalid-feedback">メールアドレスは正しい形式で入力してください。</div>
				<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>
			<div class="row mb-3">
				<label for="pwd" class="col-sm-4 col-form-label">パスワード</label>
				<div class="col-sm-8">
					<input type="password" class="form-control" th:field="*{password}" placeholder="Enter password" pattern="^[a-zA-Z0-9]+$" minlength="5" maxlength="16" required>
				</div>
				<div class="valid-feedback">問題なし</div>
				<div class="invalid-feedback">パスワードは正しい形式で入力してください。</div>
				<div class="invalid-feedback"  th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<input type="submit" class="btn btn-dark btn-lg" value="ログイン"></input>
		</form>
		<form th:action="@{/}">
			<button type="submit" class="btn btn-light btn-lg">戻る</button>
		 </form>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
	<script>
		// sha256ハッシュ用のメソッド
		// return: 引数のsha256結果のString
		function sha256(message) {
			return CryptoJS.SHA256(message).toString();
		}

		// formの参照値を所得
		const loginForm = document.getElementsByClassName("login_form")[0];
		// formのsubmit動作をformSubmit()メソッドとバイトする。
		loginForm.addEventListener("submit", formSubmit);

		function formSubmit(event) {
			// デフォルトのsubmit動作を阻止する。
			event.preventDefault();
			// パスワードの参照値を所得
			const pwdInput = document.getElementById("password");
			// 入力したパスワードを所得
			var password = pwdInput.value;
			// パスワードは空ではない場合
			if (password) {
				// ハッシュ結果
				var hashedPassword = sha256(password + 'WonderfulProject');
				// パスワードinputのvalueを変更する
				pwdInput.value = hashedPassword;
			}
			// formを提出する
			loginForm.submit();
		}


	</script>
</body>


</html>

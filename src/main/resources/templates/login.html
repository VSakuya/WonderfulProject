<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{login}+' | '+ #{shop.title}"> </title>
</head>

<body class="user">

	<h2 th:class="page_title" th:text="#{login}"></h2>
	<p th:class="description" th:text="#{msg.login.input}"></p>
	<div class="login_form_area">
		<form th:action="@{/login}" method="post" class="login_form" th:object="${loginForm}">
			<th:block th:if="${#fields.hasErrors()}">
				<div class="error_list alert alert-danger alert-dismissible text-center fade show">
					<ul class="list-unstyled">
						<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
					</ul>
					<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
				</div>
			</th:block>
			<table>
				<tbody>
					<tr>
						<th th:class="label" th:text="#{loginForm.email}">メールアドレス</th>
						<td class="input"><input type="text" th:field="*{email}" /></td>
					</tr>
					<tr>
						<th th:class="label" th:text="#{loginForm.password}">パスワード</th>
						<td class="input"><input type="password" th:field="*{password}" /></td>
					</tr>
					<tr>
						<th class="label"></th>
						<td class="input"><input type="submit" th:value="#{login}" /></td>
					</tr>
				</tbody>
			</table>
		</form>
	</div>
	<p class="complete_link">
		<a th:href="@{/}" th:text="#{msg.back.to.top}"></a>
	</p>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
	<script>
		// sha256ハッシュ用のメソッド
		// return: 引数のsha256結果のString
		function sha256(message) {
			return CryptoJS.SHA256(message).toString();
		}

		// formの参照値を所得
		const loginForm = document.getElementsByClassName("login_form")[0];
		// formのsubmit動作をformSubmit()メソッドとバイトする。
		loginForm.addEventListener("submit", formSubmit);

		function formSubmit(event) {
			// デフォルトのsubmit動作を阻止する。
			event.preventDefault();
			// パスワードの参照値を所得
			const pwdInput = document.getElementById("password");
			// 入力したパスワードを所得
			var password = pwdInput.value;
			// パスワードは空ではない場合
			if (password) {
				// ハッシュ結果
				var hashedPassword = sha256(password + 'WonderfulProject');
				// パスワードinputのvalueを変更する
				pwdInput.value = hashedPassword;
			}
			// formを提出する
			loginForm.submit();
		}


	</script>
</body>


</html>

server.servlet.context-path=/shared_shop
server.port=55000
spring.thymeleaf.cache=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/shared_shop_db?characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=Test1993

logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema_name=utf8

spring.servlet.multipart.location=${user.dir}/temp
 # Max file size.
spring.servlet.multipart.max-file-size=10MB
 #
spring.servlet.multipart.max-request-size=10MB

server.servlet.register-default-servlet=true
